stages:
  - test
  - deploy
  - visualize

include:
  #- template: Code-Quality.gitlab-ci.yml
  #- template: Jobs/SAST.gitlab-ci.yml

variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  MAVEN_IMAGE_JDK8: "maven:3.9.0-eclipse-temurin-8"
  MAVEN_IMAGE_JDK21: "maven:3.9.9-eclipse-temurin-21-alpine"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .m2/repository

# Template for verification jobs
.verify: &verify
  stage: test
  script:
    - 'mvn $MAVEN_CLI_OPTS clean org.jacoco:jacoco-maven-plugin:prepare-agent test jacoco:report'
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/failsafe-reports/TEST-*.xml"
    paths:
      - "**/target/"

# Verify with JDK 8
verify:jdk8:
  image: $MAVEN_IMAGE_JDK8
  <<: *verify


# Deploy with JDK 8
deploy:jdk8.tag:
   image: $MAVEN_IMAGE_JDK8
   stage: deploy
   needs: ["verify:jdk8"]
   script:
     - export TAG_VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
     - mvn versions:set -DnewVersion=$TAG_VERSION
     - mvn versions:commit
     - 'mvn $MAVEN_CLI_OPTS -Pgitlab deploy -s ci_settings.xml'
   only:
     - tags

deploy-snapshot:
  image: $MAVEN_IMAGE_JDK8
  stage: deploy
  needs: ["verify:jdk8"]
  script:
    - mvn versions:set -DnewVersion="2.1-SNAPSHOT"
    - mvn versions:commit
    - 'mvn $MAVEN_CLI_OPTS -Pgitlab deploy -s ci_settings.xml'
  only:
    - develop-2.1


sonarcloud-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: ["verify:jdk8"]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache

  script:
    - export SONAR_USER_HOME="/tmp/.sonar"
    - mkdir -p "$SONAR_USER_HOME"
    - sonar-scanner
  artifacts:
    paths:
      - /tmp/.sonar/*  # Optional: Weitere Artefakte, die du speichern möchtest
    when: always


