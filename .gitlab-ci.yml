#   image: $MAVEN_IMAGE_JDK8
#   stage: deploy
#   needs: ["verify:jdk8"]
#   script:
#     - if [ ! -f ci_settings.xml ]; then echo "CI settings missing! If deploying to GitLab Maven Repository, please see https://docs.gitlab.com/ee/user/packages/maven_repository/index.html#create-maven-packages-with-gitlab-cicd for instructions."; exit 1; fi
#     - 'mvn $MAVEN_CLI_OPTS -Pgitlab deploy -s ci_settings.xml'
#   only:
#     - tags
#     - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy with JDK 21
deploy:jdk21.gitlab:
  image: $MAVEN_IMAGE_JDK21
  stage: deploy
  needs: ["verify:jdk21"]
  script:
    - if [ ! -f ci_settings.xml ]; then echo "CI settings missing! If deploying to GitLab Maven Repository, please see https://docs.gitlab.com/ee/user/packages/maven_repository/index.html#create-maven-packages-with-gitlab-cicd for instructions."; exit 1; fi
    - 'mvn $MAVEN_CLI_OPTS -Pgitlab deploy -s ci_settings.xml'
  only:
    - tags
    - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


sonarcloud-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
#  needs: ["verify:jdk21"]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  artifacts:
    paths:
      - .sonar/*  # Optional: Weitere Artefakte, die du speichern möchtest
    when: always


